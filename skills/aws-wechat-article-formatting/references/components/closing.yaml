name: closing
displayName: 文末区块
category: brand
body: free

when_to_use: |
  每篇文章的最后一块，固定放互动引导与作者署名。
  方括号里填作者名，正文写引导语（点赞/在看/星标、下期见、一句抛给读者的开放问题）。
  这是读者划到底看到的最后一眼，也是全文最标准化的位置——做好一次，每篇复用。

when_not_to_use: |
  正文中间：它自带上分隔线与收尾感，出现在中间会让读者以为文章结束了。
  一篇里出现两次：收尾只能有一个。
  纯广告推广：那是 CTA 不是收尾，硬塞进来会让整块变成广告位，读者下次直接划过。

anti_pattern: |
  引导语写成「感谢阅读，我们下期再见」这类空话——读者看过一万遍，等于没写。
  真正有效的收尾是一句抛回给读者的具体问题（「你被哪个榜单坑过」），
  或一句能带走的判断。
  把「点赞在看星标」写成三行——挤成一坨，一行说完就够。
  作者名后面加职称头衔——公众号不是名片。

example: |
  :::closing[马斯]
  你最近一次因为某个基准分改变技术选型是什么时候？评论区聊聊你被哪个榜单坑过。

  觉得有用的话点个赞、点个在看，顺手加个星标，我们下期见。
  :::

# {arg} = 作者名；{content} = 引导语（空行分段）
template: |
  <section style="margin:3.2em 0 0;">
    <section style="width:36px; height:4px; background:{primary-color}; margin-bottom:16px;"></section>
    <section style="font-size:15px; line-height:1.85; color:{text-muted};">{content}</section>
    <section style="margin-top:14px; font-size:13px; letter-spacing:1px; color:{text-muted}; text-align:right;">{arg}</section>
  </section>
