name: quote-card
template: <section style="margin:48px -16px; padding:30px 24px; background:{primary-fill};"><section style="font-size:21px; line-height:1.7; font-weight:700; color:{secondary-on-fill};">{content}</section><section style="margin-top:16px; font-size:12px; letter-spacing:2px; color:#FFFFFF; opacity:.65;">—— {arg}</section></section>
body: single
