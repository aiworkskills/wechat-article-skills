name: quote-card
template: '<section style="margin:48px 0; padding:28px 22px; background:{primary-fill}; border-top:1px solid {secondary-color};"><section style="font-size:21px; line-height:1.7; font-weight:700; color:{secondary-on-fill};">{content}</section><section style="margin-top:14px; font-size:12px; letter-spacing:2px; color:#FFFFFF;">—— {arg}</section></section>'
body: single
