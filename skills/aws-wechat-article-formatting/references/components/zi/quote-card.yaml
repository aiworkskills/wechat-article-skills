name: quote-card
displayName: 金句卡
category: evidence
body: single
when_to_use: '全文最值得被单独记住、且脱离上下文仍成立的那一句。做成卡片是为了让读者截图转发——

  这是它唯一的存在理由。方括号里可填出处（人名 / 机构 / 报告名）。

  '
when_not_to_use: '这句话正文里两段之内刚说过：卡片会变成复读，读者跳过。

  内容是陈述事实而非观点（「本次发布于 9 月 3 日」）：截图出去没人转。

  一篇里已经有一张金句卡：第二张开始，稀缺性没了，两张都不会被转。

  '
anti_pattern: '一篇放三四张——这是最常见的毁掉方式，卡片密度一高就退化成装饰条。

  句子超过 40 字——手机上要滚动才能读完，截图截不全。

  把小标题塞进来当卡片用——那是 section-title 的活。

  '
example: ':::quote-card[AWS 团队]

  基准分数衡量的是你缺哪个 harness，不是模型的能力上限。

  :::

  '
template: "<section style=\"margin:64px 0; text-align:center;\">\n  <section style=\"font-size:22px; line-height:1.9; letter-spacing:3px; font-weight:500; color:{text-color};\"><span style=\"color:{primary-ink};\">&#12300;</span>{content}<span style=\"color:{primary-ink};\">&#12301;</span></section>\n  <section style=\"margin-top:20px; font-size:12px; letter-spacing:4px; color:{text-muted};\">{arg}</section>\n</section>\n"
