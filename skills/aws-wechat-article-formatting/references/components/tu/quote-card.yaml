name: quote-card
displayName: 金句卡
category: evidence
body: free
when_to_use: '全文最值得被单独记住、且脱离上下文仍成立的那一句。做成卡片是为了让读者截图转发——

  这是它唯一的存在理由。方括号里可填出处（人名 / 机构 / 报告名）。

  '
when_not_to_use: '这句话正文里两段之内刚说过：卡片会变成复读，读者跳过。

  内容是陈述事实而非观点（「本次发布于 9 月 3 日」）：截图出去没人转。

  一篇里已经有一张金句卡：第二张开始，稀缺性没了，两张都不会被转。

  '
anti_pattern: '一篇放三四张——这是最常见的毁掉方式，卡片密度一高就退化成装饰条。

  句子超过 40 字——手机上要滚动才能读完，截图截不全。

  把小标题塞进来当卡片用——那是 section-title 的活。

  '
example: ':::quote-card[AWS 团队]

  基准分数衡量的是你缺哪个 harness，不是模型的能力上限。

  :::

  '
template: "<section style=\"background:{primary-fill}; padding:26px 18px 24px; margin:44px -16px;\">\n  <section style=\"margin-bottom:14px;\"><svg width=\"40\" height=\"31\" viewBox=\"0 0 26 20\" style=\"display:block;\"><path d=\"M0 20 L0 9 C0 3.5 3.6 0.6 9.5 0 L9.5 4.2 C6.4 4.8 5 6.3 5 8.6 L5 9 L10 9 L10 20 Z M16 20 L16 9 C16 3.5 19.6 0.6 25.5 0 L25.5 4.2 C22.4 4.8 21 6.3 21 8.6 L21 9 L26 9 L26 20 Z\" fill=\"#FFFFFF\" fill-opacity=\"0.32\"/></svg></section>\n  <section style=\"font-size:21px; line-height:1.6; font-weight:800; letter-spacing:-0.3px; color:#FFFFFF;\">{content}</section>\n  <section style=\"margin-top:20px; font-size:13px; letter-spacing:1.5px; color:#FFFFFF; opacity:0.72; text-align:right;\">{arg}</section>\n</section>\n"
