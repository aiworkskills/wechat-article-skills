name: layers
displayName: 结构分层
category: infographic
body: rows
row_delimiter: "|"
row_columns: 2

when_to_use: |
  讲一个系统由哪几层组成、每层负责什么。第一列是层名，第二列是该层的职责或子项。
  仅当层与层之间**只是并列罗列**时用它。

when_not_to_use: |
  层级之间有包含或嵌套关系（A 里面套着 B 和 C）：组件只能平铺，画不出嵌套，用配图。
  需要表达数据流向（请求从上往下穿过各层）：箭头是图的活。
  超过五层：手机上会很长，读者失去整体感——整体感恰恰是这类内容的价值。

anti_pattern: |
  用它画本该有嵌套关系的结构——平铺会让读者以为各层是对等的。
  层名和职责写反（第一列写长句、第二列写短词）。
  只有两层——不值得起块。

example: |
  :::layers[一次请求经过什么]
  界面层 | 用户视图、输入校验
  逻辑层 | 业务逻辑、服务处理
  数据层 | 数据访问、数据库
  :::

template: |
  <section style="margin:2.4em 0;">
    <section style="font-size:13px; letter-spacing:1px; color:{text-muted}; margin-bottom:12px;">{arg}</section>
    {content}
  </section>
row_template: |
  <section style="background:{bg-accent-color}; border-radius:12px; padding:14px 16px; margin-bottom:8px;">
      <section style="font-size:13px; letter-spacing:1px; font-weight:700; color:{primary-ink};">{c0}</section>
      <section style="margin-top:5px; font-size:14.5px; line-height:1.65; color:{text-color};">{c1}</section>
    </section>
