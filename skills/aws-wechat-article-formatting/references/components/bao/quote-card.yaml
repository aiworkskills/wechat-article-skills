name: quote-card
template: '<section style="margin:48px 0; padding:20px 0; border-top:3px solid #111111; border-bottom:3px solid #111111;"><section style="font-size:22px; line-height:1.6; font-weight:800; letter-spacing:0.3px; color:{text-color};">{content}</section><section style="margin-top:12px; font-size:13px; letter-spacing:1px; color:{text-muted};">—— {arg}</section></section>'
body: single
