name: quote-card
template: '<section style="margin:48px 0; padding:22px 0; border-top:3px solid {primary-ink}; border-bottom:1px solid #E6E8EB;"><section style="font-size:22px; line-height:1.6; font-weight:800; color:{text-color};">{content}</section><section style="margin-top:14px; font-size:13px; letter-spacing:1px; color:{text-muted};">—— {arg}</section></section>'
body: single
