name: checklist
body: rows
row_delimiter: '|'
row_columns: 2
row_map:
  c0:
    done: <svg width="15" height="15" viewBox="0 0 16 16" style="display:block;"><path d="M2.5 8.5 L6.2 12.2 L13.5 3.8" fill="none" stroke="{primary-ink}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    todo: <svg width="15" height="15" viewBox="0 0 16 16" style="display:block;"><circle cx="8" cy="8" r="6" fill="none" stroke="#C9CED3" stroke-width="1"/></svg>
    warn: <svg width="15" height="15" viewBox="0 0 16 16" style="display:block;"><path d="M8 3 L8 9.4" stroke="{primary-ink}" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="12.4" r="0.9" fill="{primary-ink}"/></svg>
template: <section style="margin:24px 14px;">{content}</section>
row_template: <section style="display:flex; align-items:flex-start; padding:0 0 12px;"><section style="flex:0 0 auto; width:24px; padding-top:5px;">{c0}</section><section style="flex:1; font-size:15px; line-height:1.85; color:#2A2A2A;">{c1}</section></section>
