name: quote-card
template: <section style="margin:56px 14px;"><section style="font-family:Didot, 'Bodoni 72', Baskerville, serif; font-size:72px; line-height:.55; color:{primary-ink}; opacity:.3;">&ldquo;</section><section style="font-size:21px; line-height:1.75; letter-spacing:0.5px; color:{text-color}; margin-top:10px;">{content}</section><section style="margin-top:18px; font-size:11px; letter-spacing:3px; color:{text-muted};">&mdash;&nbsp;&nbsp;{arg}</section></section>
body: single
