name: quote-card
template: <section style="margin:48px 0; padding:20px 22px; background:#FBF7EE; border-radius:6px;"><section style="font-family:'Snell Roundhand', 'Bradley Hand', cursive; font-size:34px; line-height:.6; color:{primary-ink}; opacity:.5;">&ldquo;</section><section style="font-size:20px; line-height:1.7; font-weight:700; color:#2A2622; margin-top:6px;">{content}</section><section style="margin-top:12px; font-family:'Snell Roundhand', 'Bradley Hand', cursive; font-size:18px; color:{primary-ink};">— {arg}</section></section>
body: single
