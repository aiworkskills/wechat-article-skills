name: quote-card
template: <section style="margin:52px 0; display:flex; align-items:center;"><svg width="88" height="88" viewBox="0 0 88 88" style="display:block; flex:0 0 auto; margin-right:20px;"><circle cx="44" cy="44" r="44" fill="{primary-fill}"/></svg><section style="flex:1;"><section style="font-size:21px; line-height:1.5; font-weight:900; color:#111111;">{content}</section><section style="margin-top:10px; font-family:Futura, 'Avenir Next', sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6B7078;">— {arg}</section></section></section>
body: single
