name: quote-card
template: '<section style="margin:44px 0; padding:18px 18px 18px 22px; background:#F6F8FA; border-left:4px solid {primary-ink}; border-radius:0 6px 6px 0;"><section style="font-family:Menlo, Consolas, ''SF Mono'', monospace; font-size:17px; line-height:1.75; font-weight:700; color:#1F2328;"><span style="color:{primary-ink};">&gt;</span> {content}</section><section style="margin-top:10px; font-family:Menlo, Consolas, ''SF Mono'', monospace; font-size:12.5px; color:#57606A;"># {arg}</section></section>'
body: single
