name: quote-card
template: <section style="margin:44px 0; padding:4px 0 4px 20px; border-left:4px solid {primary-ink};"><section style="font-family:Menlo, Consolas, 'SF Mono', monospace; font-size:17px; line-height:1.75; font-weight:700; color:#1F2328;">{content}</section><section style="margin-top:8px; font-family:Menlo, Consolas, 'SF Mono', monospace; font-size:12.5px; color:#57606A;"># {arg}</section></section>
body: single
