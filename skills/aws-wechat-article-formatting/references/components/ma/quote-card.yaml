name: quote-card
template: <section style="margin:44px 0; padding:6px 0 6px 20px; border-left:2px solid {primary-ink};"><section style="font-size:19px; line-height:1.7; font-weight:600; color:#111827;">{content}</section><section style="margin-top:10px; font-family:Menlo, Consolas, 'SF Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6B7280;">{arg}</section></section>
body: single
