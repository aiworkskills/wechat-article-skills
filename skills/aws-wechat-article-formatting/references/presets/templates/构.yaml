name: 构
displayName: 构
skeleton: gou
description: 包豪斯。钴蓝方块压白色 Futura 数字做章节，黑 / 钴蓝 / 黄三色叠条做导语，圆方三角分隔，大圆金句。像设计 / 品牌号。
variables:
  primary-color: '#1F4FD6'
  text-color: '#111111'
  text-muted: '#6B7078'
  secondary-color: '#F2C230'
schemes:
- name: 蓝黄
  variables:
    primary-color: '#1F4FD6'
    secondary-color: '#F2C230'
- name: 赤黑
  variables:
    primary-color: '#C0392B'
    secondary-color: '#1A1A1A'
- name: 绿橙
  variables:
    primary-color: '#2A9D8F'
    secondary-color: '#E76F51'
styles:
  p: font-size:16px; line-height:1.95; letter-spacing:0.4px; color:#111111; margin:0 0 26px;
  strong: color:#111111; font-weight:900; border-bottom:3px solid {primary-fill};
  em: font-style:normal; color:{primary-ink}; font-weight:700;
  a: color:{primary-ink}; text-decoration:none; font-weight:700;
  h1: font-size:26px; font-weight:900; color:#111111; line-height:1.35; margin:0 0 28px;
  h2: font-size:22px; font-weight:900; color:#111111; line-height:1.35; letter-spacing:-0.3px; margin:0;
  h3: font-size:17px; font-weight:800; color:#111111; margin:36px 0 12px; padding-left:14px; border-left:8px solid {secondary-color};
  ul: margin:0 0 26px; padding-left:22px; list-style:square;
  ol: margin:0 0 26px; padding-left:22px; list-style:decimal;
  li: font-size:16px; line-height:1.85; color:#111111; margin:0 0 10px;
  blockquote: 'color:#111111; font-size:16px; line-height:1.85; padding:14px 0 14px 20px; margin:0 0 28px; border-left:8px solid #111111;'
  figcaption: font-family:Futura, 'Avenir Next', sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6B7078; margin:8px 0 32px;
  img: 'display:block; width:100%; height:auto; border:3px solid #111111;'
  code: font-family:Menlo, Consolas, monospace; font-size:14px; background:#F2F3F5; color:#111111; padding:1px 6px;
  table: width:100%; border-collapse:collapse; margin:0 0 28px; font-size:14.5px;
  th: 'font-family:Futura, ''Avenir Next'', sans-serif; color:#111111; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; text-align:left; padding:10px 8px; border-top:6px solid #111111; border-bottom:1px solid #111111;'
  td: 'color:#111111; padding:11px 8px; border-bottom:1px solid #E3E6EA;'
  hr: border:none; height:6px; width:100%; background:#111111; display:block; margin:52px 0;
