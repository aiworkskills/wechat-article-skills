name: 彩
displayName: 彩
skeleton: cai
description: 渐变。小标题是渐变填充字，导语顶部渐变粗条，金句渐变淡底，分隔是渐隐的渐变线。像新锐科技 / 产品号。
variables:
  primary-color: '#5B4BFF'
  text-color: '#1F1F1F'
  text-muted: '#8A8F98'
  secondary-color: '#17A398'
styles:
  p: font-size:16px; line-height:1.95; letter-spacing:0.4px; color:{text-color}; margin:0 0 26px;
  strong: font-weight:800; background:linear-gradient(90deg, {primary-ink}, {secondary-color}); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  em: font-style:normal; color:{secondary-color}; font-weight:700;
  a: color:{primary-ink}; text-decoration:none; border-bottom:2px solid {secondary-color};
  h1: font-size:25px; font-weight:800; color:{text-color}; line-height:1.4; margin:0 0 28px;
  h2: font-size:24px; font-weight:900; line-height:1.4; letter-spacing:-0.3px; margin:0 0 20px; display:inline-block; background:linear-gradient(90deg, {primary-ink}, {secondary-color}); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  h3: font-size:17px; font-weight:800; color:{primary-ink}; margin:36px 0 12px;
  ul: margin:0 0 26px; padding-left:22px; list-style:disc;
  ol: margin:0 0 26px; padding-left:22px; list-style:decimal;
  li: font-size:16px; line-height:1.85; letter-spacing:0.3px; color:{text-color}; margin:0 0 10px;
  blockquote: color:#3A3F47; font-size:16px; line-height:1.85; padding:14px 18px; margin:0 0 28px; background:{bg-accent-soft}; border-left:4px solid {secondary-color}; border-radius:0 10px 10px 0;
  figcaption: font-size:13px; color:{text-muted}; margin:8px 0 32px;
  img: display:block; width:100%; height:auto; border-radius:10px;
  code: font-family:Menlo, Consolas, monospace; font-size:14px; background:#F2F3F5; color:{text-color}; padding:1px 6px;
  table: width:100%; border-collapse:collapse; margin:0 0 28px; font-size:14.5px;
  th: color:#FFFFFF; font-size:13px; font-weight:700; padding:10px 8px; background:{primary-fill};
  td: 'color:{text-color}; padding:11px 8px; border-bottom:1px solid #E6E8EB;'
  hr: border:none; height:2px; width:100%; background:linear-gradient(90deg, {primary-ink}, rgba(255,255,255,0)); display:block; margin:52px 0;
