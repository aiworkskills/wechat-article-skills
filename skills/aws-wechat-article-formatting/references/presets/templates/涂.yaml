name: 涂
variables:
  primary-color: '#14508C'
  text-color: '#111318'
  text-muted: '#6B7078'
styles:
  p: font-size:16px; line-height:1.95; color:{text-color}; margin:0 0 28px; font-weight:400;
  li: font-size:16px; line-height:1.85; color:{text-color}; margin:0 0 10px;
  em: font-style:normal; color:{primary-ink}; font-weight:600;
  img: display:block; width:100%; height:auto; margin:8px auto 0;
  strong: 'color:{text-color}; font-weight:700; background:linear-gradient(transparent 58%, {highlight-pen} 58%);'
  a: 'color:{primary-ink}; text-decoration:none; font-weight:700; border-bottom:1px solid {primary-ink};'
  ul: margin:0 0 28px; padding-left:20px; list-style:circle;
  h2: font-size:20px; font-weight:800; color:{text-color}; line-height:1.5; margin:56px 0 20px; padding:10px 14px; background:{bg-accent-color};
  h3: font-size:17px; font-weight:800; color:{primary-ink}; line-height:1.6; margin:36px 0 12px; padding:2px 10px; background:{bg-accent-color}; display:inline-block;
  blockquote: background:{bg-accent-color}; color:{text-color}; font-size:16px; line-height:1.8; padding:16px 18px; margin:0 0 28px;
  figcaption: background:{bg-accent-color}; color:{text-muted}; font-size:13px; line-height:1.6; padding:8px 12px; margin:0 0 28px; text-align:left;
  hr: border:none; height:8px; width:64px; background:{highlight-pen}; display:block; margin:48px auto;
  ol: margin:0 0 28px; padding-left:20px; list-style:circle;
skeleton: tu
