name: 夜
displayName: 夜
skeleton: ye
description: 深色面板。导语、章节、金句、文末都是满幅深藏青面板压金字，正文白底。像用深色 banner 的科技号。
variables:
  primary-color: '#16243A'
  text-color: '#1F1F1F'
  text-muted: '#8A8F98'
  secondary-color: '#C9A45C'
styles:
  p: font-size:16px; line-height:1.95; letter-spacing:0.4px; color:{text-color}; margin:0 0 26px;
  strong: color:{primary-ink}; font-weight:700;
  em: font-style:normal; color:{secondary-on-fill}; font-weight:700;
  a: color:{primary-ink}; text-decoration:none; border-bottom:1px solid {primary-ink};
  h1: font-size:24px; font-weight:800; color:{text-color}; line-height:1.4; margin:0 0 28px;
  h2: font-size:19px; font-weight:700; color:#FFFFFF; line-height:1.5; letter-spacing:1px; margin:0; padding:14px 16px; background:{primary-fill}; border-left:4px solid {secondary-color};
  h3: font-size:17px; font-weight:700; color:{primary-fill}; line-height:1.6; margin:36px 0 12px; padding-left:12px; border-left:3px solid {secondary-color};
  ul: margin:0 0 26px; padding-left:22px; list-style:square;
  ol: margin:0 0 26px; padding-left:22px; list-style:decimal;
  li: font-size:16px; line-height:1.85; letter-spacing:0.3px; color:{text-color}; margin:0 0 10px;
  blockquote: color:#3A3F47; font-size:16px; line-height:1.85; padding:14px 18px; margin:0 0 28px; background:#F1F3F6; border-left:3px solid {secondary-color};
  figcaption: font-size:13px; color:{text-muted}; margin:8px 0 32px;
  img: display:block; width:100%; height:auto;
  code: font-family:Menlo, Consolas, monospace; font-size:14px; background:#F2F3F5; color:{text-color}; padding:1px 6px;
  table: width:100%; border-collapse:collapse; margin:0 0 28px; font-size:14.5px;
  th: color:#FFFFFF; font-size:13px; font-weight:700; padding:10px 8px; background:{primary-fill};
  td: 'color:{text-color}; padding:11px 8px; border-bottom:1px solid #E3E6EA;'
  hr: border:none; height:3px; width:40px; background:{secondary-color}; display:block; margin:52px 0;
