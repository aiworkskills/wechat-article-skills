name: 报
displayName: 报
skeleton: bao
description: 媒体编辑风。17px 大字宽字距，3px 通栏底线标题，方角，彩色粗体强调。像量子位那类账号。
variables:
  primary-color: '#1F7A6D'
  text-color: '#1F1F1F'
  text-muted: '#8A8F98'
styles:
  p: font-size:17px; line-height:2.0; letter-spacing:0.8px; color:{text-color}; margin:0 0 30px; font-variant-numeric:tabular-nums;
  strong: color:{primary-ink}; font-weight:700;
  em: font-style:normal; color:{text-color}; font-weight:700;
  a: color:{primary-ink}; text-decoration:none; border-bottom:1px solid {primary-ink};
  h1: font-size:26px; font-weight:800; color:{text-color}; line-height:1.4; margin:0 0 28px;
  h2: font-size:22px; font-weight:800; color:{text-color}; line-height:1.45; letter-spacing:0.3px; margin:60px 0 22px; padding-bottom:12px; border-bottom:3px solid {primary-ink};
  h3: font-size:18px; font-weight:800; color:{text-color}; line-height:1.6; margin:40px 0 14px; padding-left:12px; border-left:4px solid {primary-ink};
  ul: margin:0 0 30px; padding-left:22px; list-style:square;
  ol: margin:0 0 30px; padding-left:22px; list-style:decimal;
  li: font-size:17px; line-height:1.9; letter-spacing:0.5px; color:{text-color}; margin:0 0 12px; font-variant-numeric:tabular-nums;
  blockquote: color:#4A4F57; font-size:16.5px; line-height:1.9; letter-spacing:0.5px; padding:4px 0 4px 18px; margin:0 0 30px; border-left:3px solid {primary-ink};
  figcaption: font-size:13px; color:{text-muted}; margin:10px 0 34px;
  img: display:block; width:100%; height:auto;
  code: font-family:Menlo, Consolas, monospace; font-size:14.5px; background:#F2F3F5; color:{text-color}; padding:1px 6px;
  table: width:100%; border-collapse:collapse; margin:0 0 30px; font-size:15px;
  th: color:{text-muted}; font-size:13px; font-weight:700; letter-spacing:1px; text-align:left; padding:10px 8px; border-bottom:2px solid {primary-ink};
  td: 'color:{text-color}; padding:12px 8px; border-bottom:1px solid #E6E8EB; font-variant-numeric:tabular-nums;'
  hr: border:none; height:4px; width:40px; background:{primary-ink}; display:block; margin:56px 0;
