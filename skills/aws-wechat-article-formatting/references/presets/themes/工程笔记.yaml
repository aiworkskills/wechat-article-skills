name: 工程笔记
description: 开发者账号的排版。小标题带
variables:
  primary-color: '#2F6FEB'
  primary-ink: '#2F6FEB'
  bg-accent-color: '#EEF3FD'
  text-color: '#111318'
  text-muted: '#8A8F98'
styles:
  h1: font-size:26px; font-weight:800; color:#111318; line-height:1.35; letter-spacing:-0.5px; margin:0 0 32px;
  h2: 'display:inline-block; font-size:22px; font-weight:800; color:#111318; line-height:1.4; letter-spacing:-0.3px; margin:56px 0 20px; padding-bottom:12px; border-bottom:6px solid #2F6FEB;'
  h3: font-size:17px; font-weight:800; color:#2F6FEB; line-height:1.6; letter-spacing:0.5px; margin:40px 0 12px;
  h4: font-size:15px; font-weight:700; color:#111318; line-height:1.6; margin:28px 0 10px;
  p: font-size:16px; line-height:1.95; color:#111318; margin:0 0 28px; font-weight:400; letter-spacing:0.3px; font-family:Menlo, Consolas, monospace;
  strong: 'color:#111318; font-weight:700; background:linear-gradient(transparent 62%, #C9DAFA 62%);'
  em: font-style:normal; color:#2F6FEB; font-weight:600;
  a: color:#2F6FEB; text-decoration:none; font-weight:500;
  blockquote: 'color:#111318; font-size:16.5px; line-height:1.8; font-weight:500; padding:2px 0 2px 18px; margin:0 0 30px; border-left:3px solid #D6D9DE; font-family:Menlo, Consolas, monospace;'
  ul: margin:0 0 28px; padding-left:20px; list-style:disc;
  ol: margin:0 0 28px; padding-left:20px; list-style:decimal;
  li: font-size:16px; line-height:1.9; color:#111318; margin:0 0 10px; font-weight:400; letter-spacing:0.3px; font-family:Menlo, Consolas, monospace;
  hr: border:none; height:4px; width:36px; background:#2F6FEB; display:block; margin:56px auto;
  img: display:block; max-width:100%; height:auto; margin:8px auto 10px; border-radius:12px;
  figcaption: text-align:center; font-size:13px; line-height:1.7; color:#8A8F98; margin:10px 0 32px;
  code: font-family:Menlo, Consolas, monospace; font-size:14px; color:#2F6FEB; background:#EEF3FD; border-radius:5px; padding:1px 6px;
  pre: background:#141519; color:#E6E8EB; font-family:Menlo, Consolas, monospace; font-size:13px; line-height:1.8; padding:20px 18px; margin:0 0 30px; border-radius:14px; overflow-x:auto;
  highlight: background:#EEF3FD; color:#111318; font-size:16px; line-height:1.9; padding:22px 20px; margin:0 0 30px; border-radius:16px;
  table: width:100%; border-collapse:collapse; font-size:14.5px; margin:0 0 30px; font-variant-numeric:tabular-nums;
  th: 'color:#8A8F98; font-size:12.5px; font-weight:700; letter-spacing:1px; text-align:left; padding:10px 12px; border-bottom:2px solid #2F6FEB; font-variant-numeric:tabular-nums;'
  td: 'color:#111318; font-size:14.5px; line-height:1.7; padding:13px 12px; border-bottom:1px solid #EFF0F2; font-variant-numeric:tabular-nums; font-family:Menlo, Consolas, monospace;'
  del: text-decoration:line-through; color:#8A8F98;
  u: 'text-decoration:none; border-bottom:2px solid #2F6FEB; padding-bottom:1px;'
