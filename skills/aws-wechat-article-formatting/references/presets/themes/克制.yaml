name: 克制
description: 量子位 / 新智元 那一路的排版系统。零装饰件，靠字号、行距与留白撑起精致感；强调用整行彩色粗体独立成段。适合科技、AI、深度分析类账号。
variables:
  primary-color: '#07A87C'
  primary-ink: '#078461'
  bg-accent-color: '#EBF8F5'
  text-color: '#1F1C19'
  text-muted: '#8A8F98'
styles:
  h1: font-size:26px; font-weight:800; color:#1F1C19; line-height:1.35; letter-spacing:-0.5px; margin:0 0 32px;
  h2: 'display:inline-block; font-size:22px; font-weight:800; color:#1F1C19; line-height:1.4; letter-spacing:-0.3px; margin:56px 0 20px; padding-bottom:14px; border-bottom:4px solid #07A87C;'
  h3: font-size:17px; font-weight:800; color:#078461; line-height:1.6; letter-spacing:0.5px; margin:40px 0 12px;
  h4: font-size:15px; font-weight:700; color:#1F1C19; line-height:1.6; margin:28px 0 10px;
  p: font-size:16px; line-height:1.95; color:#1F1C19; margin:0 0 28px; font-weight:400; padding:0 12px; letter-spacing:0.6px;
  strong: 'color:#1F1C19; font-weight:700; background:linear-gradient(transparent 62%, #BFE8DD 62%);'
  em: font-style:normal; color:#078461; font-weight:600;
  a: color:#078461; text-decoration:none; font-weight:500;
  blockquote: 'color:#1F1C19; font-size:16.5px; line-height:1.8; font-weight:500; padding:2px 0 2px 18px; margin:0 0 30px; border-left:3px solid #D6D9DE;'
  ul: margin:0 0 28px; padding-left:20px; list-style:disc;
  ol: margin:0 0 28px; padding-left:20px; list-style:decimal;
  li: font-size:16px; line-height:1.9; color:#1F1C19; margin:0 0 10px; font-weight:400; padding:0 12px; letter-spacing:0.6px;
  hr: border:none; height:4px; width:36px; background:#07A87C; display:block; margin:56px auto;
  img: display:block; max-width:100%; height:auto; margin:8px auto 10px; border-radius:12px;
  figcaption: text-align:center; font-size:13px; line-height:1.7; color:#8A8F98; margin:10px 0 32px;
  code: font-family:Menlo, Consolas, monospace; font-size:14px; color:#078461; background:#EBF8F5; border-radius:5px; padding:1px 6px;
  pre: background:#141519; color:#E6E8EB; font-family:Menlo, Consolas, monospace; font-size:13px; line-height:1.8; padding:20px 18px; margin:0 0 30px; border-radius:14px; overflow-x:auto;
  highlight: background:#EBF8F5; color:#1F1C19; font-size:16px; line-height:1.9; padding:22px 20px; margin:0 0 30px; border-radius:16px;
  table: width:100%; border-collapse:collapse; font-size:14.5px; margin:0 0 30px; font-variant-numeric:tabular-nums;
  th: 'color:#8A8F98; font-size:12.5px; font-weight:700; letter-spacing:1px; text-align:left; padding:10px 12px; border-bottom:2px solid #07A87C; font-variant-numeric:tabular-nums;'
  td: 'color:#1F1C19; font-size:14.5px; line-height:1.7; padding:13px 12px; border-bottom:1px solid #EFF0F2; font-variant-numeric:tabular-nums;'
  del: text-decoration:line-through; color:#8A8F98;
  u: 'text-decoration:none; border-bottom:2px solid #07A87C; padding-bottom:1px;'
